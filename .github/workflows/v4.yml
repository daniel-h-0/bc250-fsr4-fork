name: v4 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 scripts/check-repo.py
      - if: matrix.python == '3.12'
        run: |
          python3 -m pip install -r requirements-dev.txt
          ruff check .
          ruff format --check .

  source-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Export and verify the complete source without Git metadata
        run: |
          python3 scripts/source-release.py --output dist/source
          cd dist/source
          sha256sum -c *.sha256
          tar -xzf *.tar.gz
          cd bc250-fsr4-*/
          python3 scripts/check-repo.py
          python3 scripts/build.py --prepare-only --work .work/ci-source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-snapshot
          path: |
            dist/source/*.tar.gz
            dist/source/*.sha256
      - name: Verify the small end-user setup distribution
        run: |
          python3 scripts/source-release.py --setup --output dist/setup
          cd dist/setup
          sha256sum -c *.sha256
          tar -xzf *.tar.gz
          cd bc250-fsr4-setup-*/
          ./bc250-fsr4 --help
          ./bc250-fsr4 install --help
          ./install-v4.sh --help
          ./install-runtime.sh --help
          ./setup-game.sh --help
          python3 -B -c 'import sys; sys.path.insert(0, "scripts"); import driver, runtime, runtime_bundle, manage'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup-bundle
          path: |
            dist/setup/*.tar.gz
            dist/setup/*.sha256

  source-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: BC250_CONTAINER_ENGINE=docker ./build-anywhere.sh --jobs 4
      - name: Package the completed build and check the extracted distribution
        run: |
          python3 scripts/package.py --work .work/container --label ci-unqualified-x86_64
          cd dist
          sha256sum -c *.sha256
          tar -xzf *.tar.gz
          cd bc250-fsr4-*/
          python3 scripts/check-repo.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unqualified-container-build
          include-hidden-files: true
          path: |
            .work/container/build-result.json
            .work/container/inputs.json
            dist/*.tar.gz
            dist/*.sha256

  dll-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Obtain and verify the pinned public build inputs
        run: |
          python3 - <<'PY'
          import hashlib, json, tarfile, urllib.request
          from pathlib import Path
          root = Path('.work/dll-inputs')
          root.mkdir(parents=True)
          manifest = json.loads(Path('dll/manifest.json').read_text())
          inputs = [
              ('sdk.dll', manifest['sdk_url'], manifest['sdk_sha256']),
              ('dxc.tar.gz', manifest['dxcompiler_archive']['url'], manifest['dxcompiler_archive']['sha256']),
          ]
          for name, url, expected in inputs:
              path = root / name
              with urllib.request.urlopen(url, timeout=120) as response, path.open('xb') as stream:
                  while chunk := response.read(1024 * 1024):
                      stream.write(chunk)
              with path.open('rb') as stream:
                  actual = hashlib.file_digest(stream, 'sha256').hexdigest()
              if actual != expected:
                  raise RuntimeError('Build input hash mismatch: ' + name)
          with tarfile.open(root / 'dxc.tar.gz') as archive:
              archive.extractall(root / 'dxc', filter='data')
          PY
      - name: Rebuild and validate all shaders and the exact release DLL
        run: |
          python3 dll/build.py --sdk .work/dll-inputs/sdk.dll \
            --dxcompiler .work/dll-inputs/dxc/linux_dxc_2026_07_29.x86_x64/lib/libdxcompiler.so \
            --output .work/dll-build --jobs 2
          python3 scripts/package-dll.py \
            --dll .work/dll-build/amd_fidelityfx_upscaler_dx12.dll --output dist/dll
          cd dist/dll
          sha256sum -c *.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-dll-candidate
          path: |
            dist/dll/*.zip
            dist/dll/*.sha256
